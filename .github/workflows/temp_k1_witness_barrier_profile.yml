name: Temporary K1 witness barrier profile

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.repository == 'tejas-shivanand-mane/ray'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply K1 witness barrier profile
        run: python tools/_apply_k1_witness_barrier_profile.py

      - name: Validate textual patch
        run: |
          python -m py_compile gossip_benchmarks/70_recovery_succession_k1_quick_control_profile.py
          git diff --check

      - name: Commit source change and remove applicator
        run: |
          rm tools/_apply_k1_witness_barrier_profile.py
          rm .github/workflows/temp_k1_witness_barrier_profile.yml
          git config user.name "tejas-shivanand-mane"
          git config user.email "38262749+tejas-shivanand-mane@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Profile K1 witness publication barrier [skip ci]"
          git push origin HEAD:main
