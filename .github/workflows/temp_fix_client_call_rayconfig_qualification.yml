name: Temporary fix client_call RayConfig qualification

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.repository == 'tejas-shivanand-mane/ray'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply RayConfig qualification fix
        run: python tools/_fix_client_call_rayconfig_qualification.py

      - name: Validate textual fix
        run: |
          grep -q "::RayConfig::instance().enable_recovery_succession_profiling()" src/ray/rpc/client_call.h
          ! grep -q "if (RayConfig::instance().enable_recovery_succession_profiling())" src/ray/rpc/client_call.h
          git diff --check

      - name: Commit source fix and remove applicator
        run: |
          rm tools/_fix_client_call_rayconfig_qualification.py
          rm .github/workflows/temp_fix_client_call_rayconfig_qualification.yml
          git config user.name "tejas-shivanand-mane"
          git config user.email "38262749+tejas-shivanand-mane@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix recovery profiling RayConfig qualification [skip ci]"
          git push origin HEAD:main
