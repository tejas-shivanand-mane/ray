name: Apply recovery frontier integration

on:
  push:
    branches: [main]
    paths:
      - '.github/apply_frontier_integration.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply integration and commit
        shell: bash
        run: |
          set -euo pipefail
          python .github/apply_frontier_integration.py
          rm -f .github/frontier-integration.patch
          rm .github/apply_frontier_integration.py
          rm .github/workflows/apply-frontier-integration.yml
          git config user.name "openai-frontier-bot"
          git config user.email "openai-frontier-bot@users.noreply.github.com"
          git add -A
          git commit -m "Wire recovery frontier planner into recovery manager"
          git push origin HEAD:main
