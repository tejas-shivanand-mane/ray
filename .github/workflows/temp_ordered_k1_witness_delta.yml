name: Temporary ordered K1 witness delta patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp_ordered_k1_witness_delta.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply ordered K1 witness delta patch
        run: python3 tmp_ordered_k1_witness_delta.py
      - name: Commit source change and remove applicator
        shell: bash
        run: |
          git config user.name "tejas-shivanand-mane"
          git config user.email "38262749+tejas-shivanand-mane@users.noreply.github.com"
          git add src/ray/core_worker/core_worker.cc src/ray/raylet/node_manager.cc
          git rm .github/workflows/temp_ordered_k1_witness_delta.yml tmp_ordered_k1_witness_delta.py
          git diff --cached --check
          git commit -m "Use ordered K1 rank-2 witness delta [skip ci]"
          git push origin HEAD:main
