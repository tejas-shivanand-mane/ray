name: Temporary K1 CQ witness drain

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.repository == 'tejas-shivanand-mane/ray'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix applicator matching
        run: python tools/_fix_k1_cq_applicator.py

      - name: Apply K1 CQ witness drain
        run: python tools/_apply_k1_cq_witness_drain.py

      - name: Validate textual patch
        run: |
          git diff --check
          grep -q "RunCompletionQueueHook" src/ray/rpc/client_call.h
          grep -q "completion_queue_hook" src/ray/rpc/grpc_client.h
          grep -q "AdvanceRecoveryWitnessBatchTransport" src/ray/raylet_rpc_client/raylet_client.cc
          grep -q "use_cq_transport_drain" src/ray/raylet_rpc_client/raylet_client.cc
          grep -q "enable_recovery_witness_holder_baseline" src/ray/raylet_rpc_client/raylet_client.cc

      - name: Commit source change and remove applicator
        run: |
          rm tools/_fix_k1_cq_applicator.py
          rm tools/_apply_k1_cq_witness_drain.py
          rm .github/workflows/temp_apply_k1_cq_witness_drain.yml
          git config user.name "tejas-shivanand-mane"
          git config user.email "38262749+tejas-shivanand-mane@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Drain K1 witness transport at gRPC completion [skip ci]"
          git push origin HEAD:main
