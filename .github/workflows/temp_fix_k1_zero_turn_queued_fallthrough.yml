name: Temporary K1 witness queued fallthrough fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.repository == 'tejas-shivanand-mane/ray'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply queued fallthrough fix
        run: python tools/_fix_k1_zero_turn_queued_fallthrough.py
      - name: Validate textual patch
        run: git diff --check
      - name: Commit source fix and remove applicator
        run: |
          rm tools/_fix_k1_zero_turn_queued_fallthrough.py
          rm .github/workflows/temp_fix_k1_zero_turn_queued_fallthrough.yml
          git config user.name "tejas-shivanand-mane"
          git config user.email "38262749+tejas-shivanand-mane@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix queued K1 witness microbatch fallthrough [skip ci]"
          git push origin HEAD:main
