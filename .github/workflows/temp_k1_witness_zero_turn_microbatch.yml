name: Temporary K1 witness zero-turn microbatch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.repository == 'tejas-shivanand-mane/ray'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply zero-turn K1 witness microbatch
        run: python tools/_apply_k1_witness_zero_turn_microbatch.py

      - name: Validate textual patch
        run: |
          python -m py_compile gossip_benchmarks/70_recovery_succession_k1_quick_control_profile.py
          grep -q 'use_k1_zero_turn_microbatch' src/ray/raylet_rpc_client/raylet_client.cc
          grep -q 'FlushRecoveryWitnessMicrobatch' src/ray/raylet_rpc_client/raylet_client.cc
          grep -q 'witness_batch_handler_time_ns' src/ray/protobuf/node_manager.proto
          grep -q 'set_witness_batch_handler_time_ns' src/ray/raylet/node_manager.cc
          git diff --check

      - name: Commit source change and remove applicator
        run: |
          rm tools/_apply_k1_witness_zero_turn_microbatch.py
          rm .github/workflows/temp_k1_witness_zero_turn_microbatch.yml
          git config user.name "tejas-shivanand-mane"
          git config user.email "38262749+tejas-shivanand-mane@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Microbatch K1 witness updates on next event-loop turn [skip ci]"
          git push origin HEAD:main
