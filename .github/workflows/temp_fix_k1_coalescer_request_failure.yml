name: Temporary K1 coalescer request failure fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.repository == 'tejas-shivanand-mane/ray'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply request-failure lane-advance fix
        run: python tools/_fix_k1_coalescer_request_failure.py
      - name: Validate textual fix
        run: |
          git diff --check
          grep -q "There is no real CompletionQueue event" src/ray/rpc/grpc_client.h
          grep -q "completion_queue_hook();" src/ray/rpc/grpc_client.h
      - name: Commit source fix and remove temporary files
        run: |
          rm tools/_fix_k1_coalescer_request_failure.py
          rm .github/workflows/temp_fix_k1_coalescer_request_failure.yml
          git config user.name "tejas-shivanand-mane"
          git config user.email "38262749+tejas-shivanand-mane@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Handle K1 CQ hook on injected request failure [skip ci]"
          git push origin HEAD:main
