name: Temporary fix CQ hook tag lifetime

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.repository == 'tejas-shivanand-mane/ray'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply CQ hook tag lifetime fix
        run: python tools/_fix_cq_hook_tag_lifetime.py

      - name: Validate textual fix
        run: |
          git diff --check
          grep -q "auto call = tag->GetCall();" src/ray/rpc/client_call.h
          grep -q "call->RunCompletionQueueHook();" src/ray/rpc/client_call.h
          if grep -A18 "main_service_.post" src/ray/rpc/client_call.h | grep -q "tag->GetCall()->RunCompletionQueueHook"; then
            echo "unsafe tag dereference remains after post" >&2
            exit 1
          fi

      - name: Commit source fix and remove applicator
        run: |
          rm tools/_fix_cq_hook_tag_lifetime.py
          rm .github/workflows/temp_fix_cq_hook_tag_lifetime.yml
          git config user.name "tejas-shivanand-mane"
          git config user.email "38262749+tejas-shivanand-mane@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix CQ witness hook tag lifetime [skip ci]"
          git push origin HEAD:main
