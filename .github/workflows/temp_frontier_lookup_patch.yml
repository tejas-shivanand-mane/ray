name: Temporary Recovery Frontier Lookup Patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp_frontier_lookup_patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply narrow CoreWorker patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/ray/core_worker/core_worker.cc")
          text = path.read_text()
          start_marker = "  if (recovery_witness_holder_baseline_enabled_) {\n  if (recovery_frontier_grouping_enabled) {"
          end_marker = "  } else if (initialized_now) {"
          start = text.find(start_marker)
          if start < 0:
              raise SystemExit("frontier baseline block start not found")
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit("frontier baseline block end not found")
          end += len(end_marker)
          new_lines = [
              "  if (recovery_witness_holder_baseline_enabled_) {",
              "    if (recovery_frontier_grouping_enabled) {",
              "      RAY_CHECK(frontier_membership.has_value());",
              "",
              "      // The initial metadata fast-path above already established that this",
              "      // export still needs activation. PublishRecoveryFrontierGroup() is the",
              "      // acknowledged-prefix visibility barrier: it returns only after this",
              "      // group's currently registered members are durable on every fixed-R",
              "      // holder. Re-checking HasRecoveryMetadata() around that barrier adds",
              "      // manager lock/hash lookups without adding a correctness check.",
              "      // Racing exporters safely join the same barrier.",
              "      PublishRecoveryFrontierGroup(",
              "          frontier_membership->group_id, frontier_protection_manifest);",
              "",
              "      if (metadata == nullptr) {",
              "        return true;",
              "      }",
              "      return recovery_succession_manager_->PopulateRecoveryMetadata(",
              "          object_id, metadata);",
              "    } else if (initialized_now) {",
          ]
          replacement = "\n".join(new_lines)
          path.write_text(text[:start] + replacement + text[end:])
          PY
      - name: Commit source patch
        shell: bash
        run: |
          git config user.name 'tejas-shivanand-mane'
          git config user.email '38262749+tejas-shivanand-mane@users.noreply.github.com'
          git add src/ray/core_worker/core_worker.cc
          git commit -m 'Elide redundant frontier metadata lookups [skip ci]'
          git push origin HEAD:main
