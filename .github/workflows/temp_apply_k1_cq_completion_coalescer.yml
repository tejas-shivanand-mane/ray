name: Temporary K1 CQ completion coalescer

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.repository == 'tejas-shivanand-mane/ray'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore rejected CQ-drain experiment to profiling baseline
        run: |
          git checkout 28e486413b5318965f3b5b5089d9770fdfbeec20 -- \
            src/ray/rpc/client_call.h \
            src/ray/rpc/grpc_client.h \
            src/ray/raylet_rpc_client/raylet_client.h \
            src/ray/raylet_rpc_client/raylet_client.cc
          git diff --check
          git config user.name "tejas-shivanand-mane"
          git config user.email "38262749+tejas-shivanand-mane@users.noreply.github.com"
          git add src/ray/rpc/client_call.h \
                  src/ray/rpc/grpc_client.h \
                  src/ray/raylet_rpc_client/raylet_client.h \
                  src/ray/raylet_rpc_client/raylet_client.cc
          git commit -m "Revert CQ witness drain experiment [skip ci]"

      - name: Apply CQ drain plus single-flight completion coalescing
        run: python tools/_apply_k1_cq_completion_coalescer.py

      - name: Validate textual patch
        run: |
          git diff --check
          grep -q "CoalescedClientCallbackState" src/ray/rpc/client_call.h
          grep -q "EnqueueCoalescedMainLoopCallback" src/ray/rpc/client_call.h
          grep -q "RunCompletionQueueHook" src/ray/rpc/client_call.h
          grep -q "coalesce_main_loop_callback" src/ray/rpc/grpc_client.h
          grep -q "AdvanceRecoveryWitnessBatchTransport" src/ray/raylet_rpc_client/raylet_client.cc
          grep -q "use_cq_transport_drain" src/ray/raylet_rpc_client/raylet_client.cc
          grep -q "enable_recovery_witness_holder_baseline" src/ray/raylet_rpc_client/raylet_client.cc
          grep -q "enable_recovery_frontier" src/ray/raylet_rpc_client/raylet_client.cc

      - name: Commit new experiment and remove temporary files
        run: |
          rm tools/_apply_k1_cq_completion_coalescer.py
          rm .github/workflows/temp_apply_k1_cq_completion_coalescer.yml
          git add -A
          git diff --cached --check
          git commit -m "Coalesce K1 witness completions on main loop [skip ci]"
          git push origin HEAD:main
