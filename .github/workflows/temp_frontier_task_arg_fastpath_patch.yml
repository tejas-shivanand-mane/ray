name: Temporary Recovery Frontier task-argument fast-path patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp_frontier_task_arg_fastpath_patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply task-argument fast-path patch
        run: python3 tmp_frontier_task_arg_fastpath_patch.py
      - name: Commit source changes
        shell: bash
        run: |
          git config user.name "tejas-shivanand-mane"
          git config user.email "38262749+tejas-shivanand-mane@users.noreply.github.com"
          git add \
            src/ray/core_worker/core_worker.h \
            src/ray/core_worker/core_worker.cc \
            src/ray/core_worker/task_submission/actor_task_submitter.h \
            src/ray/core_worker/task_submission/actor_task_submitter.cc \
            python/ray/includes/libcoreworker.pxd \
            python/ray/_raylet.pyx
          git diff --cached --check
          git commit -m "Defer Frontier activation for nested task arguments [skip ci]"
          git push origin HEAD:main
