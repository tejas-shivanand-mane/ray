name: Temporary K1 witness coordinator patch

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/apply_k1_witness_coordinator.py'
      - '.github/workflows/temp_k1_witness_coordinator.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply K1 witness coordinator patch
        run: python .github/scripts/apply_k1_witness_coordinator.py
      - name: Commit source change and remove applicator
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'tejas-shivanand-mane'
          git config user.email '38262749+tejas-shivanand-mane@users.noreply.github.com'
          git rm .github/scripts/apply_k1_witness_coordinator.py
          git rm .github/workflows/temp_k1_witness_coordinator.yml
          git add src/ray/core_worker/core_worker.cc src/ray/raylet/node_manager.cc src/ray/protobuf/node_manager.proto
          git diff --cached --check
          git commit -m 'Move K1 witness fan-out off owner [skip ci]'
          git push origin HEAD:main
