name: Temporary Recovery Frontier Lifecycle Patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp_frontier_lifecycle_patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply lifecycle patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}")
              p.write_text(text.replace(old, new, 1))

          # 1) Planner lifecycle API.
          path = "src/ray/core_worker/recovery_frontier.h"
          old = "\n".join([
              "  const RecoveryFrontierGroup *GetGroup(const TaskID &group_id) const;",
              "  RecoveryFrontierGroup *GetMutableGroup(const TaskID &group_id);",
              "",
              " private:",
          ])
          new = "\n".join([
              "  const RecoveryFrontierGroup *GetGroup(const TaskID &group_id) const;",
              "  RecoveryFrontierGroup *GetMutableGroup(const TaskID &group_id);",
              "",
              "  /// Permanently close a partially filled group so future tasks open a",
              "  /// fresh group instead of appending to a terminal/tombstoned capsule.",
              "  bool SealGroup(const TaskID &group_id);",
              "",
              "  /// Remove a terminal group and all task-to-group membership aliases.",
              "  /// The caller must ensure no live owner return can activate it again.",
              "  bool EraseGroup(const TaskID &group_id);",
              "",
              " private:",
          ])
          replace_once(path, old, new)

          path = "src/ray/core_worker/recovery_frontier.cc"
          old = "\n".join([
              "RecoveryFrontierGroup *RecoveryFrontierPlanner::GetMutableGroup(",
              "    const TaskID &group_id) {",
              "  const auto it = groups_.find(group_id);",
              "  return it == groups_.end() ? nullptr : &it->second;",
              "}",
              "",
              "}  // namespace ray::core",
          ])
          new = "\n".join([
              "RecoveryFrontierGroup *RecoveryFrontierPlanner::GetMutableGroup(",
              "    const TaskID &group_id) {",
              "  const auto it = groups_.find(group_id);",
              "  return it == groups_.end() ? nullptr : &it->second;",
              "}",
              "",
              "bool RecoveryFrontierPlanner::SealGroup(const TaskID &group_id) {",
              "  if (group_id.IsNil() || groups_.find(group_id) == groups_.end()) {",
              "    return false;",
              "  }",
              "  if (open_group_id_ == group_id) {",
              "    open_group_id_ = TaskID::Nil();",
              "  }",
              "  return true;",
              "}",
              "",
              "bool RecoveryFrontierPlanner::EraseGroup(const TaskID &group_id) {",
              "  const auto group_it = groups_.find(group_id);",
              "  if (group_it == groups_.end()) {",
              "    return false;",
              "  }",
              "  if (open_group_id_ == group_id) {",
              "    open_group_id_ = TaskID::Nil();",
              "  }",
              "  for (const RecoveryFrontierMember &member : group_it->second.Members()) {",
              "    membership_by_task_.erase(member.task_id);",
              "  }",
              "  groups_.erase(group_it);",
              "  return true;",
              "}",
              "",
              "}  // namespace ray::core",
          ])
          replace_once(path, old, new)

          # 2) Group-aware owner-return lifetime. The last live member seals the",
          # group. Activated groups publish one group tombstone; never-activated",
          # groups are erased locally without network cleanup.
          path = "src/ray/core_worker/recovery_succession_manager.cc"
          p = Path(path)
          text = p.read_text()
          start = text.find("bool RecoverySuccessionManager::HandleOwnerReturnRefDeleted(")
          end = text.find("\n\nstd::vector<RecoverySuccessionManager::CandidateReport>", start)
          if start < 0 or end < 0:
              raise SystemExit("HandleOwnerReturnRefDeleted block not found")
          replacement = "\n".join([
              "bool RecoverySuccessionManager::HandleOwnerReturnRefDeleted(",
              "    const ObjectID &object_id,",
              "    bool *final_return_deleted) {",
              "  if (final_return_deleted != nullptr) {",
              "    *final_return_deleted = false;",
              "  }",
              "",
              "  if (object_id.IsNil()) {",
              "    return false;",
              "  }",
              "",
              "  const TaskID task_id = object_id.TaskId();",
              "",
              "  absl::MutexLock lock(&mutex_);",
              "",
              "  auto retained_it = owner_retained_tasks_.find(task_id);",
              "  if (retained_it == owner_retained_tasks_.end()) {",
              "    return false;",
              "  }",
              "",
              "  if (retained_it->second.live_return_ids.erase(object_id) == 0) {",
              "    return false;",
              "  }",
              "",
              "  if (!retained_it->second.live_return_ids.empty()) {",
              "    return false;",
              "  }",
              "",
              "  if (final_return_deleted != nullptr) {",
              "    *final_return_deleted = true;",
              "  }",
              "",
              "  const uint64_t retained_bytes = retained_it->second.task_spec_bytes;",
              "",
              "  if (profiling_enabled_) {",
              "    ++profile_.owner_retained_task_specs_released;",
              "",
              "    if (profile_.owner_retained_task_specs_current > 0) {",
              "      --profile_.owner_retained_task_specs_current;",
              "    }",
              "",
              "    if (profile_.owner_retained_task_spec_bytes_current >= retained_bytes) {",
              "      profile_.owner_retained_task_spec_bytes_current -= retained_bytes;",
              "    } else {",
              "      profile_.owner_retained_task_spec_bytes_current = 0;",
              "    }",
              "  }",
              "",
              "  owner_retained_tasks_.erase(retained_it);",
              "",
              "  if (recovery_frontier_planner_ != nullptr &&",
              "      recovery_frontier_planner_->GroupSize() > 1) {",
              "    const auto membership = recovery_frontier_planner_->FindTask(task_id);",
              "    if (membership.has_value()) {",
              "      const RecoveryFrontierGroup *group =",
              "          recovery_frontier_planner_->GetGroup(membership->group_id);",
              "      RAY_CHECK(group != nullptr);",
              "",
              "      for (const RecoveryFrontierMember &member : group->Members()) {",
              "        const auto live_it = owner_retained_tasks_.find(member.task_id);",
              "        if (live_it != owner_retained_tasks_.end() &&",
              "            !live_it->second.live_return_ids.empty()) {",
              "          return false;",
              "        }",
              "      }",
              "",
              "      // This was the final live member. Close a partially filled group",
              "      // before any future task can reuse its protection identity.",
              "      RAY_CHECK(recovery_frontier_planner_->SealGroup(membership->group_id));",
              "",
              "      if (recovery_frontier_protection_manifests_.contains(",
              "              membership->group_id)) {",
              "        // One shared tombstone will retire every committed member alias",
              "        // on the fixed-R holders.",
              "        return true;",
              "      }",
              "",
              "      // The group was never activated/exported, so there is no remote",
              "      // recovery state to tombstone. Reclaim the owner-local planner state.",
              "      RAY_CHECK(recovery_frontier_planner_->EraseGroup(membership->group_id));",
              "      return false;",
              "    }",
              "  }",
              "",
              "  const auto task_it = task_states_.find(task_id);",
              "  return task_it != task_states_.end() &&",
              "         !task_it->second.manifest.tombstoned();",
              "}",
          ])
          text = text[:start] + replacement + text[end:]
          p.write_text(text)

          # 3) Canonical group tombstone construction from any member TaskID.
          p = Path(path)
          text = p.read_text()
          start = text.find("std::optional<rpc::RecoveryManifest> RecoverySuccessionManager::BuildTombstoneForTask(")
          end = text.find("\nbool RecoverySuccessionManager::ApplyRecoveryTombstone(", start)
          if start < 0 or end < 0:
              raise SystemExit("BuildTombstoneForTask block not found")
          replacement = "\n".join([
              "std::optional<rpc::RecoveryManifest> RecoverySuccessionManager::BuildTombstoneForTask(",
              "    const TaskID &task_id) const {",
              "  absl::MutexLock lock(&mutex_);",
              "",
              "  if (recovery_frontier_planner_ != nullptr &&",
              "      recovery_frontier_planner_->GroupSize() > 1) {",
              "    const auto membership = recovery_frontier_planner_->FindTask(task_id);",
              "    if (membership.has_value()) {",
              "      const RecoveryFrontierGroup *group =",
              "          recovery_frontier_planner_->GetGroup(membership->group_id);",
              "      if (group == nullptr) {",
              "        return std::nullopt;",
              "      }",
              "",
              "      // A group tombstone is legal only when every registered member has",
              "      // lost its final owner return. This protects live siblings from an",
              "      // early leader/member deletion.",
              "      for (const RecoveryFrontierMember &member : group->Members()) {",
              "        const auto live_it = owner_retained_tasks_.find(member.task_id);",
              "        if (live_it != owner_retained_tasks_.end() &&",
              "            !live_it->second.live_return_ids.empty()) {",
              "          return std::nullopt;",
              "        }",
              "      }",
              "",
              "      const auto protection_it =",
              "          recovery_frontier_protection_manifests_.find(membership->group_id);",
              "      if (protection_it == recovery_frontier_protection_manifests_.end()) {",
              "        return std::nullopt;",
              "      }",
              "",
              "      const rpc::RecoveryHolder *owner =",
              "          FindHolderByRank(protection_it->second, 0);",
              "      if (owner == nullptr || !SameWorker(owner->address(), self_address_)) {",
              "        return std::nullopt;",
              "      }",
              "",
              "      rpc::RecoveryManifest tombstone;",
              "      tombstone.CopyFrom(protection_it->second);",
              "      tombstone.set_task_id(membership->group_id.Binary());",
              "      tombstone.set_tombstoned(true);",
              "      tombstone.set_frozen(true);",
              "      tombstone.mutable_version()->set_generation(",
              "          protection_it->second.version().generation() + 1);",
              "      return tombstone;",
              "    }",
              "  }",
              "",
              "  const auto task_it = task_states_.find(task_id);",
              "",
              "  if (task_it == task_states_.end()) {",
              "    return std::nullopt;",
              "  }",
              "",
              "  const TaskRecoveryState &task_state = task_it->second;",
              "",
              "  if (!task_state.manifest_committed || task_state.manifest.tombstoned()) {",
              "    return std::nullopt;",
              "  }",
              "",
              "  const rpc::RecoveryHolder *owner = FindHolderByRank(task_state.manifest, 0);",
              "",
              "  if (owner == nullptr || !SameWorker(owner->address(), self_address_)) {",
              "    return std::nullopt;",
              "  }",
              "",
              "  rpc::RecoveryManifest tombstone;",
              "  tombstone.CopyFrom(task_state.manifest);",
              "  tombstone.set_tombstoned(true);",
              "  tombstone.set_frozen(true);",
              "  tombstone.mutable_version()->set_generation(",
              "      task_state.manifest.version().generation() + 1);",
              "  return tombstone;",
              "}",
              "",
          ])
          text = text[:start] + replacement + text[end+1:]
          p.write_text(text)

          # 4) Applying a group tombstone removes every member state + aliases.
          p = Path(path)
          text = p.read_text()
          func_start = text.find("bool RecoverySuccessionManager::ApplyRecoveryTombstone(")
          needle = "  absl::MutexLock lock(&mutex_);\n\n  const auto task_it = task_states_.find(task_id);"
          pos = text.find(needle, func_start)
          if func_start < 0 or pos < 0:
              raise SystemExit("ApplyRecoveryTombstone insertion point not found")
          group_block = "\n".join([
              "  absl::MutexLock lock(&mutex_);",
              "",
              "  if (recovery_frontier_planner_ != nullptr &&",
              "      recovery_frontier_planner_->GroupSize() > 1) {",
              "    const RecoveryFrontierGroup *group =",
              "        recovery_frontier_planner_->GetGroup(task_id);",
              "    const auto protection_it =",
              "        recovery_frontier_protection_manifests_.find(task_id);",
              "    if (group != nullptr &&",
              "        protection_it != recovery_frontier_protection_manifests_.end()) {",
              "      if (CompareManifestVersions(tombstone, protection_it->second) <= 0) {",
              "        return false;",
              "      }",
              "",
              "      std::vector<TaskID> member_task_ids;",
              "      member_task_ids.reserve(group->Members().size());",
              "      for (const RecoveryFrontierMember &member : group->Members()) {",
              "        member_task_ids.push_back(member.task_id);",
              "      }",
              "",
              "      for (const TaskID &member_task_id : member_task_ids) {",
              "        EraseTaskObjectMetadataLocked(member_task_id);",
              "",
              "        const auto reservation_it =",
              "            holder_reservation_by_task_.find(member_task_id);",
              "        if (reservation_it != holder_reservation_by_task_.end()) {",
              "          std::vector<std::string> reservation_ids;",
              "          reservation_ids.reserve(reservation_it->second.size());",
              "          for (const auto &[rank, reservation_id] : reservation_it->second) {",
              "            static_cast<void>(rank);",
              "            reservation_ids.push_back(reservation_id);",
              "          }",
              "          for (const std::string &reservation_id : reservation_ids) {",
              "            EraseHolderReservationLocked(reservation_id);",
              "          }",
              "        }",
              "",
              "        candidate_reports_sent_.erase(member_task_id);",
              "        task_states_.erase(member_task_id);",
              "        owner_retained_tasks_.erase(member_task_id);",
              "      }",
              "",
              "      recovery_frontier_protection_manifests_.erase(protection_it);",
              "      RAY_CHECK(recovery_frontier_planner_->EraseGroup(task_id));",
              "      return true;",
              "    }",
              "  }",
              "",
              "  const auto task_it = task_states_.find(task_id);",
          ])
          text = text[:pos] + group_block + text[pos+len(needle):]
          p.write_text(text)

          # 5) Deduplicate tombstones by the canonical manifest TaskID. This lets",
          # both lineage-release and ref-deletion callbacks race safely while a",
          # member TaskID canonicalizes to its group leader ID.
          path = "src/ray/core_worker/core_worker.cc"
          old = "\n".join([
              "            auto tombstone = recovery_succession_manager_->BuildTombstoneForTask(task_id);",
              "",
              "            if (!tombstone.has_value()) {",
              "              return;",
              "            }",
              "",
              "            if (!recovery_tombstones_in_flight_.insert(task_id).second) {",
              "              return;",
              "            }",
              "",
              "            RAY_LOG(INFO).WithField(task_id) << \"Task lineage released; \"",
              "                                             << \"publishing recovery tombstone\";",
              "",
              "            PublishRecoveryTombstone(std::move(tombstone.value()));",
          ])
          new = "\n".join([
              "            auto tombstone = recovery_succession_manager_->BuildTombstoneForTask(task_id);",
              "",
              "            if (!tombstone.has_value()) {",
              "              return;",
              "            }",
              "",
              "            const TaskID tombstone_task_id =",
              "                TaskID::FromBinary(tombstone->task_id());",
              "            if (!recovery_tombstones_in_flight_.insert(tombstone_task_id).second) {",
              "              return;",
              "            }",
              "",
              "            RAY_LOG(INFO).WithField(tombstone_task_id)",
              "                << \"Task lineage released; publishing recovery tombstone\";",
              "",
              "            PublishRecoveryTombstone(std::move(tombstone.value()));",
          ])
          replace_once(path, old, new)

          old = "\n".join([
              "            auto tombstone =",
              "                recovery_succession_manager_->BuildTombstoneForTask(deleted_task_id);",
              "            if (!tombstone.has_value()) {",
              "              return;",
              "            }",
              "",
              "            if (!recovery_tombstones_in_flight_.insert(deleted_task_id).second) {",
              "              return;",
              "            }",
              "",
              "            RAY_LOG(INFO).WithField(deleted_task_id)",
              "                << \"Owner return refs released; publishing recovery tombstone\";",
              "",
              "            PublishRecoveryTombstone(std::move(tombstone.value()));",
          ])
          new = "\n".join([
              "            auto tombstone =",
              "                recovery_succession_manager_->BuildTombstoneForTask(deleted_task_id);",
              "            if (!tombstone.has_value()) {",
              "              return;",
              "            }",
              "",
              "            const TaskID tombstone_task_id =",
              "                TaskID::FromBinary(tombstone->task_id());",
              "            if (!recovery_tombstones_in_flight_.insert(tombstone_task_id).second) {",
              "              return;",
              "            }",
              "",
              "            RAY_LOG(INFO).WithField(tombstone_task_id)",
              "                << \"Owner return refs released; publishing recovery tombstone\";",
              "",
              "            PublishRecoveryTombstone(std::move(tombstone.value()));",
          ])
          replace_once(path, old, new)

          # 6) Planner lifecycle regression tests.
          path = "src/ray/core_worker/frontier_tests/recovery_frontier_test.cc"
          marker = "TEST(RecoveryFrontierTest, KOneDegeneratesToPerTaskProtection) {"
          p = Path(path)
          text = p.read_text()
          if text.count(marker) != 1:
              raise SystemExit("KOne test marker not found uniquely")
          tests = "\n".join([
              "TEST(RecoveryFrontierTest, SealedOpenGroupForcesFreshLeader) {",
              "  RecoveryFrontierPlanner planner(/*group_size=*/4);",
              "  const auto first = planner.RegisterTask(MakeTask('a'));",
              "  const auto second = planner.RegisterTask(MakeTask('b'));",
              "  ASSERT_EQ(first.group_id, second.group_id);",
              "",
              "  ASSERT_TRUE(planner.SealGroup(first.group_id));",
              "  const auto third = planner.RegisterTask(MakeTask('c'));",
              "  EXPECT_NE(third.group_id, first.group_id);",
              "  EXPECT_TRUE(third.is_leader);",
              "  EXPECT_EQ(third.member_index, 0U);",
              "}",
              "",
              "TEST(RecoveryFrontierTest, ErasedTerminalGroupRemovesMembershipAliases) {",
              "  RecoveryFrontierPlanner planner(/*group_size=*/4);",
              "  const rpc::TaskSpec first_task = MakeTask('a');",
              "  const rpc::TaskSpec second_task = MakeTask('b');",
              "  const auto first = planner.RegisterTask(first_task);",
              "  planner.RegisterTask(second_task);",
              "",
              "  ASSERT_TRUE(planner.SealGroup(first.group_id));",
              "  ASSERT_TRUE(planner.EraseGroup(first.group_id));",
              "  EXPECT_EQ(planner.GetGroup(first.group_id), nullptr);",
              "  EXPECT_FALSE(planner.FindTask(TaskID::FromBinary(first_task.task_id())).has_value());",
              "  EXPECT_FALSE(planner.FindTask(TaskID::FromBinary(second_task.task_id())).has_value());",
              "",
              "  const auto replacement = planner.RegisterTask(MakeTask('c'));",
              "  EXPECT_TRUE(replacement.is_leader);",
              "  EXPECT_NE(replacement.group_id, first.group_id);",
              "}",
              "",
          ])
          p.write_text(text.replace(marker, tests + marker, 1))
          PY
      - name: Commit source changes
        shell: bash
        run: |
          git config user.name 'tejas-shivanand-mane'
          git config user.email '38262749+tejas-shivanand-mane@users.noreply.github.com'
          git add src/ray/core_worker/recovery_frontier.h \
                  src/ray/core_worker/recovery_frontier.cc \
                  src/ray/core_worker/recovery_succession_manager.cc \
                  src/ray/core_worker/core_worker.cc \
                  src/ray/core_worker/frontier_tests/recovery_frontier_test.cc
          git commit -m 'Make Recovery Frontier lifecycle group-aware [skip ci]'
          git push origin HEAD:main
