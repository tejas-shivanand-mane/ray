name: Temporary restore K1 immediate witness batching

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.repository == 'tejas-shivanand-mane/ray'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore immediate-idle witness batching
        run: python tools/_restore_k1_immediate_witness_batching.py

      - name: Validate textual patch
        run: |
          python -m py_compile gossip_benchmarks/70_recovery_succession_k1_quick_control_profile.py
          git diff --check
          ! grep -q "FlushRecoveryWitnessMicrobatch" src/ray/raylet_rpc_client/raylet_client.cc
          ! grep -q "flush_scheduled" src/ray/raylet_rpc_client/raylet_client.h
          grep -q "witness_batch_handler_time_ns" src/ray/protobuf/node_manager.proto
          grep -q "set_witness_batch_handler_time_ns" src/ray/raylet/node_manager.cc

      - name: Commit restore and remove applicator
        run: |
          rm tools/_restore_k1_immediate_witness_batching.py
          rm .github/workflows/temp_restore_k1_immediate_witness_batching.yml
          git config user.name "tejas-shivanand-mane"
          git config user.email "38262749+tejas-shivanand-mane@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Restore immediate K1 witness batching [skip ci]"
          git push origin HEAD:main
