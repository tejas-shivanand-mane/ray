name: Temporary rank-2 witness handoff patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp_rank2_witness_handoff.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore rejected receiver experiment and apply handoff patch
        shell: bash
        run: |
          git checkout 1ce790c5b20620b961ad62ff75cbad964d7ac287 -- src/ray/core_worker/recovery_succession_manager.cc
          python3 tmp_rank2_witness_handoff_patch.py
          rm tmp_rank2_witness_handoff_patch.py
          rm .github/workflows/temp_rank2_witness_handoff.yml
      - name: Commit source change and cleanup
        shell: bash
        run: |
          git config user.name "tejas-shivanand-mane"
          git config user.email "38262749+tejas-shivanand-mane@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Pipeline K1 rank-2 witness handoff [skip ci]"
          git push origin HEAD:main
