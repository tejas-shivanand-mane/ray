name: Temporary Recovery Frontier Deferred Dispatch Patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp_frontier_deferred_dispatch_patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply deferred dispatch follow-up fixes
        run: python3 tmp_frontier_deferred_dispatch_patch.py
      - name: Commit source changes
        shell: bash
        run: |
          git config user.name "tejas-shivanand-mane"
          git config user.email "38262749+tejas-shivanand-mane@users.noreply.github.com"
          git add src/ray/core_worker/recovery_frontier_publication.cc \
                  src/ray/core_worker/recovery_succession_manager.cc
          git diff --cached --check
          git commit -m "Fix deferred Recovery Frontier publication details [skip ci]"
          git push origin HEAD:main
