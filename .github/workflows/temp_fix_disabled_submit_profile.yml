name: Temporary disabled submit profile fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp_fix_disabled_submit_profile.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 tmp_fix_disabled_submit_profile.py
      - name: Commit source changes
        shell: bash
        run: |
          git config user.name "tejas-shivanand-mane"
          git config user.email "38262749+tejas-shivanand-mane@users.noreply.github.com"
          git add src/ray/core_worker/core_worker.h src/ray/core_worker/core_worker.cc
          git diff --cached --check
          git commit -m "Allow submit-stage profiling in disabled control [skip ci]"
          git push origin HEAD:main
