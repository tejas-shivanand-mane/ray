name: Apply Recovery Frontier visibility barrier

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-recovery-frontier-visibility-barrier.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply acknowledged-prefix visibility barrier
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def insert_once(path, marker, insertion, *, before=False):
              p = Path(path)
              text = p.read_text()
              if insertion.strip() in text:
                  raise RuntimeError(f"{path}: insertion already present")
              count = text.count(marker)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one marker, found {count}")
              replacement = insertion + marker if before else marker + insertion
              p.write_text(text.replace(marker, replacement, 1))

          def insert_after_two_lines(path, first, second, insertion):
              p = Path(path)
              text = p.read_text()
              if insertion.strip() in text:
                  raise RuntimeError(f"{path}: insertion already present")
              lines = text.splitlines(keepends=True)
              matches = [
                  i for i in range(len(lines) - 1)
                  if lines[i].rstrip("\n") == first and lines[i + 1].rstrip("\n") == second
              ]
              if len(matches) != 1:
                  raise RuntimeError(f"{path}: expected one two-line anchor, found {len(matches)}")
              i = matches[0]
              lines.insert(i + 2, insertion)
              p.write_text("".join(lines))

          def replace_core_worker_frontier_branch(path):
              p = Path(path)
              lines = p.read_text().splitlines(keepends=True)
              target = "if (initialized_now && recovery_witness_holder_baseline_enabled_) {"
              matches = [i for i, line in enumerate(lines) if line.strip() == target]
              if len(matches) != 1:
                  raise RuntimeError(f"{path}: expected one CoreWorker frontier branch, found {len(matches)}")
              i = matches[0]
              expected = [
                  "if (recovery_frontier_grouping_enabled) {",
                  "RAY_CHECK(frontier_membership.has_value());",
                  "PublishRecoveryFrontierGroup(",
                  "frontier_membership->group_id, frontier_protection_manifest);",
                  "} else {",
              ]
              actual = [lines[i + j].strip() for j in range(1, 6)]
              if actual != expected:
                  raise RuntimeError(f"{path}: unexpected CoreWorker frontier block: {actual}")

              replacement = '''  if (recovery_witness_holder_baseline_enabled_) {
            if (recovery_frontier_grouping_enabled) {
              RAY_CHECK(frontier_membership.has_value());

              // RegisterOwnedTaskLazy creates task-local state first, but the
              // manager deliberately hides its recovery metadata until the member
              // is inside the acknowledged frontier prefix. Concurrent exporters
              // join the same barrier instead of escaping with an ordinary ref.
              if (!recovery_succession_manager_->HasRecoveryMetadata(object_id)) {
                PublishRecoveryFrontierGroup(
                    frontier_membership->group_id, frontier_protection_manifest);
              }
            } else if (initialized_now) {
          '''.splitlines(keepends=True)
              lines[i:i + 6] = replacement
              p.write_text("".join(lines))

          insert_once(
              "src/ray/core_worker/recovery_succession_manager.h",
              "  bool CommitRecoveryFrontierAppend(const RecoveryFrontierAppendBatch &batch);\n",
              '''  /// True while at least one member of the group remains outside the
          /// acknowledged durable prefix. Used by synchronous object export to
          /// wait behind an append already being published by another thread.
          bool RecoveryFrontierGroupHasUncommittedMembers(
              const TaskID &group_id) const;

          ''',
              before=True)

          insert_once(
              "src/ray/core_worker/recovery_succession_manager.cc",
              "bool RecoverySuccessionManager::CommitRecoveryFrontierAppend(\n",
              '''bool RecoverySuccessionManager::RecoveryFrontierGroupHasUncommittedMembers(
              const TaskID &group_id) const {
            if (group_id.IsNil()) {
              return false;
            }

            absl::MutexLock lock(&mutex_);
            if (recovery_frontier_planner_ == nullptr) {
              return false;
            }
            const RecoveryFrontierGroup *group =
                recovery_frontier_planner_->GetGroup(group_id);
            return group != nullptr && group->HasUncommittedMembers();
          }

          ''',
              before=True)

          insert_after_two_lines(
              "src/ray/core_worker/recovery_succession_manager.cc",
              "  if (known_object && task_it != task_states_.end() &&",
              "      !task_it->second.manifest.task_id().empty()) {",
              '''    // Recovery Frontier metadata is an acknowledged-prefix capability.
            // The owner may construct task-local recovery state before the fixed-R
            // append completes, but that state must remain invisible to exporters
            // until the member's replay recipe is committed on every group holder.
            if (recovery_frontier_planner_ != nullptr &&
                recovery_frontier_planner_->GroupSize() > 1) {
              const auto membership = recovery_frontier_planner_->FindTask(task_id);
              if (membership.has_value()) {
                const RecoveryFrontierGroup *group =
                    recovery_frontier_planner_->GetGroup(membership->group_id);
                if (group == nullptr || !group->IsTaskCommitted(task_id)) {
                  return false;
                }
              }
            }

          ''')

          replace_core_worker_frontier_branch("src/ray/core_worker/core_worker.cc")
          PY

      - name: Commit source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ray/core_worker/core_worker.cc \
                  src/ray/core_worker/recovery_succession_manager.cc \
                  src/ray/core_worker/recovery_succession_manager.h
          git commit -m "Close recovery frontier metadata visibility window [skip ci]"
          git push origin HEAD:main
