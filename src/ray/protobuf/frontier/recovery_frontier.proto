syntax = "proto3";

package ray.rpc;

import "src/ray/protobuf/common.proto";

// One replay recipe inside a Recovery Frontier protection group.
message RecoveryFrontierMemberRecord {
  bytes task_id = 1;
  uint32 member_index = 2;
  uint32 first_group_return_index = 3;
  uint32 num_returns = 4;
  TaskSpec task_spec = 5;
}

// Append-only wire update for one Recovery Frontier group.
//
// A holder applies an append only when base_generation matches its current
// committed generation and begin_member_index matches its committed prefix.
// The first append therefore has base_generation=0, generation=1 and begins at
// member 0. Later appends carry only the newly committed suffix rather than
// retransmitting the complete group.
message RecoveryFrontierAppend {
  bytes group_id = 1;
  uint64 base_generation = 2;
  uint64 generation = 3;
  uint32 begin_member_index = 4;
  uint32 end_member_index = 5;  // exclusive
  repeated RecoveryFrontierMemberRecord members = 6;
}
